<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f2ed"><meta name="description" content="Tiny50M running privately on your device.">
  <title>Tiny50M</title><link rel="stylesheet" href="./styles.css">
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.webgpu.min.js"></script>
</head>
<body><main>
  <header><a class="brand" href="./" aria-label="Tiny50M home">tiny<span>50m</span></a><div class="state"><i id="dot"></i><span id="status">Ready</span></div></header>
  <section id="empty" class="empty"><h1>Small model.<br>Right here.</h1><p>Private, on-device, no account.</p></section>
  <section id="chat" class="chat" aria-live="polite"></section>
  <form id="composer"><textarea id="prompt" rows="1" maxlength="1600" aria-label="Message" placeholder="Message Tiny50M"></textarea><button id="send" type="submit" aria-label="Send"><span>↑</span></button></form>
  <footer><span id="runtime">Runs locally</span><button id="clear" type="button">Clear</button></footer>
</main><script type="module" src="./app.js"></script></body>
</html>
