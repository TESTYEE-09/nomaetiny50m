<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Tiny50M</title><style>body{margin:auto;max-width:850px;padding:30px;background:#101216;color:#eee;font:16px system-ui}#chat{min-height:55vh;border:1px solid #333;border-radius:14px;padding:18px;white-space:pre-wrap}.bar{display:flex;gap:8px;margin-top:12px}textarea{flex:1;background:#181b21;color:#fff;border:1px solid #444;border-radius:10px;padding:12px}button{background:#e34b4b;color:white;border:0;border-radius:10px;padding:0 18px}.muted{color:#9aa}</style></head><body><h1>Tiny50M</h1><p id="status" class="muted">Checking WebGPU…</p><div id="chat"></div><div class="bar"><textarea id="input" placeholder="Message Tiny50M"></textarea><button id="send">Send</button><button id="reset">Reset</button></div><p class="muted">Tokens/sec: <span id="tps">—</span></p><script type="module">const status=document.querySelector('#status'),chat=document.querySelector('#chat');if(!navigator.gpu){status.textContent='WebGPU is unavailable in this browser.'}else{const adapter=await navigator.gpu.requestAdapter();status.textContent=adapter?'WebGPU ready. Model export not loaded.':'No WebGPU adapter available.'}document.querySelector('#reset').onclick=()=>chat.textContent='';document.querySelector('#send').onclick=()=>{chat.textContent+='\nYou: '+document.querySelector('#input').value+'\nTiny50M: Model weights have not been trained/exported yet.\n';};</script></body></html>
